<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playtronic TV</title>
    <link rel="icon" href="https://i.ibb.co/21gS8VzM/1330.png" type="image/png">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b0f19 0%, #1a1a2e 50%, #16213e 100%);
            background-attachment: fixed;
            color: #e2e8f0;
            min-height: 100vh;
            padding-top: 130px;
            padding-left: 20px;
            padding-right: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: fixed; top: 0; left: 0; width: 100%; height: 110px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px;
            background: rgba(21, 41, 97, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-brand { display: flex; align-items: center; width: 350px; }
        .logo-link { display: flex; align-items: center; text-decoration: none; cursor: pointer; }
        .header-logo { height: 80px; width: auto; object-fit: contain; transition: transform 0.3s, opacity 0.3s; }
        .logo-link:hover .header-logo { transform: scale(1.05); opacity: 0.85; }

        .search-container { flex: 1; max-width: 500px; margin: 0 20px; }
        .search-container input {
            width: 100%; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 12px 20px 12px 42px; border-radius: 25px; font-size: 1rem; outline: none;
            transition: all 0.3s ease;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="%23a0aec0" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>');
            background-repeat: no-repeat; background-position: 15px center;
        }
        .search-container input:focus { background-color: rgba(255,255,255,0.15); border-color: #fdbb2d; box-shadow: 0 0 15px rgba(253, 187, 45, 0.2); }
        .search-container input::placeholder { color: #cbd5e1; }

        .auth-area { display: flex; align-items: center; gap: 12px; width: 250px; justify-content: flex-end; }
        .login-btn {
            background: #4285f4; color: #fff; border: none; padding: 10px 18px; border-radius: 8px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.3s;
        }
        .login-btn:hover { background: #3367d6; }

        .user-info { display: none; align-items: center; gap: 10px; cursor: pointer; position: relative; }
        .user-info.active { display: flex; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fdbb2d; }
        .user-card {
            position: absolute; top: 55px; right: 0; background: #152961; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 15px; min-width: 220px; display: none; flex-direction: column; z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .user-card.active { display: flex; }
        .user-name { font-weight: bold; color: #fff; }
        .user-email { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 10px; }
        .logout-btn { background: #ef4444; color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #dc2626; }

        #catalogScreen { flex: 1; padding-bottom: 40px; }

        .catalog-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px; max-width: 1400px; margin: 0 auto; width: 100%;
        }

        .card {
            background: #16213e; border: 1px solid #1f2a4a; border-radius: 12px; overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex; flex-direction: column; position: relative; width: 100%;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.5); border-color: #4a5568; }

        .card-poster { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #0b0f19; }
        .card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
        .card:hover .card-poster img { transform: scale(1.05); }
        .card-poster::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0;
            height: 35%; background: linear-gradient(to top, #16213e, transparent); pointer-events: none;
        }

        .rating-badge {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75);
            color: #fdbb2d; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem;
            font-weight: bold; display: flex; align-items: center; gap: 4px; z-index: 2;
            backdrop-filter: blur(4px); border: 1px solid rgba(253,187,45,0.3);
        }

        .favorite-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6);
            border: none; color: #fff; font-size: 1.1rem; width: 34px; height: 34px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 3; transition: background 0.2s, transform 0.2s; backdrop-filter: blur(4px);
        }
        .favorite-btn:hover { background: rgba(253,187,45,0.3); transform: scale(1.1); }
        .favorite-btn.active { color: #ff4757; }

        .admin-actions {
            position: absolute; bottom: 10px; right: 10px;
            display: none; gap: 6px; z-index: 5;
        }
        body.is-admin .admin-actions { display: flex; }
        .admin-btn {
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff; width: 32px; height: 32px; border-radius: 6px;
            cursor: pointer; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px); transition: 0.2s;
        }
        .admin-btn.edit { background: rgba(253,187,45,0.92); color: #000; }
        .admin-btn.edit:hover { background: #fdbb2d; transform: scale(1.08); }
        .admin-btn.delete { background: rgba(231,76,60,0.92); }
        .admin-btn.delete:hover { background: #c0392b; transform: scale(1.08); }

        .card-info { padding: 15px; display: flex; flex-direction: column; flex: 1; justify-content: flex-start; z-index: 2; }
        .card-title {
            font-size: 1.15rem; font-weight: 600; color: #f8fafc; line-height: 1.3; margin-bottom: 4px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: left; min-height: 2.6em;
        }

        .card-tags {
            display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; min-height: 22px;
        }
        .tag {
            padding: 3px 8px; border-radius: 4px;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px;
        }
        .tag-bra { background: #16a34a; color: #fff; }
        .tag-eng { background: #2563eb; color: #fff; }
        .tag-pago { background: #f59e0b; color: #000; }
        .tag-ad { background: #dc2626; color: #fff; }

        .card-meta {
            font-size: 0.8rem; font-style: italic; color: #94a3b8; line-height: 1.35;
            margin-bottom: 8px;
        }
        .card-meta-line { display: block; }

        .watch-btn {
            background: #fdbb2d; color: #000; border: none; padding: 10px; border-radius: 6px;
            font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: background 0.2s, transform 0.1s; width: 100%;
            margin-top: auto;
        }
        .watch-btn:hover { background: #ffcc44; transform: scale(1.02); }

        .admin-toolbar {
            position: fixed; bottom: 24px; right: 24px; z-index: 999;
            display: none; padding: 10px 12px;
            background: rgba(21, 41, 97, 0.94); backdrop-filter: blur(10px);
            border: 1px solid rgba(253,187,45,0.35); border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        body.is-admin .admin-toolbar { display: block; }
        .admin-toolbar button {
            background: #fdbb2d; color: #000; border: none;
            padding: 10px 16px; border-radius: 8px; font-weight: 700;
            cursor: pointer; font-size: 0.85rem; transition: 0.2s;
            display: flex; align-items: center; gap: 6px;
            font-family: inherit;
        }
        .admin-toolbar button:hover { background: #ffcc44; transform: translateY(-1px); }

        body.is-admin #catalogScreen { padding-bottom: 100px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.72);
            display: none; align-items: center; justify-content: center;
            z-index: 1500; backdrop-filter: blur(6px); padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #152961; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px; padding: 26px; width: 100%; max-width: 520px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h2 { color: #fdbb2d; margin-bottom: 6px; font-size: 1.25rem; }
        .modal-sub { color: #cbd5e1; font-size: 0.85rem; margin-bottom: 8px; }
        .modal label {
            display: block; color: #fdbb2d; font-size: 0.8rem; font-weight: 700;
            margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .modal input[type="text"], .modal select {
            width: 100%; background: rgba(255,255,255,0.08); color: #fff;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            padding: 11px 14px; font-size: 0.95rem; outline: none; transition: 0.2s;
            font-family: inherit;
        }
        .modal input[type="text"]:focus, .modal select:focus {
            border-color: #fdbb2d; background: rgba(255,255,255,0.12); box-shadow: 0 0 0 3px rgba(253,187,45,0.15);
        }
        .modal input[type="text"]::placeholder { color: #64748b; }
        .modal select option { background: #152961; color: #fff; }
        .url-hint { font-size: 0.78rem; color: #94a3b8; margin-top: 6px; min-height: 1em; }
        .url-hint.ok { color: #4ade80; }
        .url-hint.warn { color: #fbbf24; }

        .modal-checkbox-row {
            display: flex; align-items: center; gap: 20px; margin-top: 14px;
            flex-wrap: wrap;
        }
        .modal-checkbox-row label {
            display: inline-flex; align-items: center; gap: 8px;
            margin: 0; text-transform: none; letter-spacing: 0;
            font-size: 0.9rem; color: #e2e8f0; cursor: pointer;
        }
        .modal-checkbox-row input[type="checkbox"],
        .modal-checkbox-row input[type="radio"] {
            width: 18px; height: 18px; accent-color: #fdbb2d; cursor: pointer;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
        .modal-actions button {
            padding: 10px 20px; border-radius: 8px; border: none;
            font-weight: 700; cursor: pointer; font-size: 0.9rem; transition: 0.2s;
            font-family: inherit;
        }
        .modal-actions .secondary { background: rgba(255,255,255,0.12); color: #fff; }
        .modal-actions .secondary:hover { background: rgba(255,255,255,0.2); }
        .modal-actions .primary { background: #fdbb2d; color: #000; }
        .modal-actions .primary:hover { background: #ffcc44; }

        /* ===== PLAYER ===== */
        #playerScreen {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, rgba(11,15,25,0.97) 0%, rgba(26,26,46,0.97) 50%, rgba(22,33,62,0.97) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
            opacity: 0; visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        #playerScreen.active { opacity: 1; visibility: visible; }

        .player-container {
            width: 100%; max-width: 1200px;
            display: flex; flex-direction: column; align-items: center;
            gap: 15px;
        }

        .player-wrapper {
            width: 100%;
            max-height: calc(100vh - 160px); 
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px; overflow: hidden; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .player-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 250px;
            background: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.4) 70%, transparent 100%);
            z-index: 5; pointer-events: none; transition: opacity 0.4s ease;
        }
        .player-wrapper::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 300px;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.4) 70%, transparent 100%);
            z-index: 5; pointer-events: none; transition: opacity 0.4s ease;
        }
        .player-wrapper.hide-shadows::before, .player-wrapper.hide-shadows::after { opacity: 0; }

        .player-wrapper iframe {
            width: 100%; height: 100%; display: block; border: none;
            position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none;
        }

        .custom-ui {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 20; pointer-events: none;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .custom-ui.player-ui-hidden { opacity: 0 !important; visibility: hidden !important; }

        .close-player-btn {
            position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 40px; height: 40px;
            border-radius: 50%; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
            pointer-events: auto;
        }
        .close-player-btn:hover { background: #e74c3c; transform: scale(1.1); }

        .player-vote-container {
            position: absolute; top: 15px; right: 15px; display: flex; gap: 10px;
            background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1); pointer-events: auto;
        }
        .player-vote-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff;
            padding: 6px 12px; border-radius: 15px; cursor: pointer; font-weight: bold;
            font-size: 0.9rem; display: flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .player-vote-btn:hover { background: rgba(255,255,255,0.25); }
        .player-vote-btn.like.active { background: #2ecc71; border-color: #2ecc71; color: #fff; }
        .player-vote-btn.dislike.active { background: #e74c3c; border-color: #e74c3c; color: #fff; }

        .center-play-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; border-radius: 50%; background: #000000;
            border: 2px solid #ffffff; color: #fff; font-size: 2.2rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 25; pointer-events: auto;
            transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s;
            padding-left: 6px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }
        .center-play-btn:hover { background: #fdbb2d; color: #000; border-color: #fdbb2d; transform: translate(-50%, -50%) scale(1.1); }
        .center-play-btn.playing-state { padding-left: 0; }

        .player-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 20px 20px 15px; display: flex; align-items: center; gap: 15px;
            pointer-events: auto;
        }

        .control-btn {
            background: none; border: none; color: #fff; padding: 5px;
            cursor: pointer; font-size: 1.2rem; font-weight: bold; transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .control-btn:hover { transform: scale(1.2); color: #fdbb2d; }

        .progress-track {
            flex: 1; height: 6px; background: rgba(255,255,255,0.2);
            border-radius: 3px; cursor: pointer; position: relative; margin: 0 10px;
        }
        .progress-fill { height: 100%; background: #fdbb2d; border-radius: 3px; width: 0%; transition: width 0.1s linear; }
        .time-label { font-family: monospace; font-size: 0.85rem; color: #ddd; min-width: 100px; text-align: right; }

        .volume-container { display: flex; align-items: center; gap: 8px; }
        .volume-slider {
            -webkit-appearance: none; width: 80px; height: 4px;
            background: rgba(255,255,255,0.3); border-radius: 2px; outline: none; cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: #fdbb2d; cursor: pointer;
        }

        /* Container do banner horizontal */
        #player-bottom-ad {
            display: none;
            width: 728px;
            max-width: 100%;
            height: 90px;
            background: transparent;
            border: 2px solid #fdbb2d;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            margin: 0 auto;
            position: relative;
        }
        #player-bottom-ad iframe {
            display: block; border: 0; margin: 0 auto; width: 728px; height: 90px;
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* ===== INTERSTICIAL ===== */
        #adInterstitialModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 99999; display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); padding: 20px; gap: 20px;
        }
        #adInterstitialModal.active { display: flex; }

        .ad-native-side {
            width: 160px; height: 600px; flex-shrink: 0;
            background: transparent;
            /* Borda removida daqui */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; overflow: hidden; position: relative;
        }
        .ad-native-side iframe { width: 100%; height: 100%; display: block; border: 0; position: absolute; z-index: 1; top:0; left:0; }

        .ad-interstitial-wrapper {
            background: #152961; 
            /* Borda removida daqui */
            border-radius: 12px;
            width: 100%; max-width: 800px; display: flex; flex-direction: column;
            box-shadow: 0 0 60px rgba(253,187,45,0.2); overflow: hidden; flex-shrink: 0;
        }

        .ad-interstitial-header {
            background: rgba(253,187,45,0.1); padding: 15px 25px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); color: #fdbb2d;
            font-weight: bold; font-size: 1rem;
        }

        .ad-center-wrapper {
            width: 100%; aspect-ratio: 16 / 9;
            background: #0b0f19; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .ad-center-wrapper img { width: 100%; height: 100%; object-fit: contain; padding: 20px; }

        .ad-interstitial-footer {
            padding: 15px 20px; text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
        }

        .ad-close-btn {
            background: #ef4444; color: #fff; border: none; padding: 12px 40px;
            border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;
            transition: 0.3s; opacity: 0.5; cursor: not-allowed;
        }
        .ad-close-btn.active {
            opacity: 1; cursor: pointer; background: #22c55e;
        }
        .ad-close-btn.active:hover { background: #16a34a; transform: scale(1.05); }

        @media (max-width: 1150px) {
            .ad-native-side { display: none; }
        }

        .loading { text-align: center; padding: 60px; color: #fdbb2d; font-size: 1.2rem; font-weight: bold; }
        .empty-state { text-align: center; padding: 60px; color: #a0aec0; font-size: 1.1rem; display: none; }

        .site-footer {
            background-color: #101c36; text-align: center; padding: 35px 20px;
            margin-top: auto; border-top: 1px solid rgba(255,255,255,0.08);
            width: 100%; display: flex; flex-direction: column; align-items: center;
        }
        .site-footer p { color: #a0aec0; margin-bottom: 10px; font-size: 0.85rem; letter-spacing: 0.5px; text-transform: uppercase; }
        .site-footer strong { color: #e2e8f0; font-weight: 700; }
        .site-footer a.contact-link { color: #fdbb2d; text-decoration: none; font-weight: bold; transition: color 0.2s; }
        .site-footer a.contact-link:hover { color: #ffcc44; text-decoration: underline; }
        .footer-logo-link { display: inline-block; margin-top: 15px; transition: transform 0.3s, filter 0.3s; }
        .footer-logo-link:hover { transform: scale(1.1); filter: brightness(1.3) drop-shadow(0 0 10px rgba(255, 0, 0, 0.4)); }
        .footer-logo { height: 25px; max-width: 150px; width: auto; object-fit: contain; }

        #favoritesSection {
            margin-bottom: 30px; width: 100%; max-width: 1400px;
            margin-left: auto; margin-right: auto;
        }
        .carousel-title { color: #fdbb2d; font-size: 1.3rem; margin-bottom: 12px; padding-left: 10px; }
        .carousel-wrapper { position: relative; display: flex; align-items: center; }
        .carousel-track {
            display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth;
            scrollbar-width: none; padding: 10px; width: 100%;
        }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-track .card { flex: 0 0 250px; width: 250px; }
        .carousel-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);

            #player-bottom-ad { display: none !important; }
        }
    </style>
</head>

<script>
    /* ========= FIREBASE ========= */
    const firebaseConfig = {
        apiKey: "AIzaSyAfD0QOlAVb50612u6siwCxzfZfGmgEB2E",
        authDomain: "playtronic-tv.firebaseapp.com",
        projectId: "playtronic-tv",
        storageBucket: "playtronic-tv.firebasestorage.app",
        messagingSenderId: "272337341020",
        appId: "1:272337341020:web:a30d949985fd614b5c7499",
        databaseURL: "https://playtronic-tv-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const rtdb = firebase.database();

    const ADMIN_EMAIL = 'playtronicpublisher@mail.com';

    /* ========= ESTADO ========= */
    let currentUser = null;
    let videos = [];
    let currentFilter = '';
    let currentPlayerVideoId = null;
    let videoModalMode = 'add';
    let editingVideoKey = null;
    let favoritesRef = null;
    let userFavorites = {};
    let votesCache = {}; 
    let videosLoaded = false;
    let favoritesLoaded = false;

    /* ========= HELPERS ========= */
    function isAdmin() {
        return currentUser && currentUser.email === ADMIN_EMAIL;
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function extractYouTubeId(url) {
        if (!url) return null;
        url = url.trim();
        if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
        try {
            const u = new URL(url);
            const host = u.hostname.replace(/^www\./, '');
            if (host === 'youtu.be') return u.pathname.slice(1).split('/')[0] || null;
            if (['youtube.com', 'm.youtube.com', 'music.youtube.com'].includes(host)) {
                if (u.pathname === '/watch') return u.searchParams.get('v');
                if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
                if (u.pathname.startsWith('/v/')) return u.pathname.split('/')[2];
                if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
                if (u.pathname.startsWith('/live/')) return u.pathname.split('/')[2];
            }
        } catch (_) { return null; }
        return null;
    }

    /* ========= MONTAGEM ISOLADA DE BANNERS (LATERAIS E INTERSTICIAL) ========= */
    function mountStandardAd(container, opts, scriptSrc) {
        if (!container || container.dataset.mounted === '1') return;
        container.dataset.mounted = '1';
        
        const iframe = document.createElement('iframe');
        iframe.setAttribute('scrolling', 'no');
        iframe.setAttribute('frameborder', '0');
        iframe.width = String(opts.width);
        iframe.height = String(opts.height);
        iframe.style.cssText = 'display:block; border:0; margin:0 auto; overflow:hidden; position:absolute; top:0; left:0; width:100%; height:100%;';
        iframe.title = 'Publicidade';
        container.appendChild(iframe);

        const d = iframe.contentWindow.document;
        d.open();
        d.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="utf-8">
                <style>
                    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #000000; }
                    .ad-content { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; }
                </style>
            </head>
            <body>
                <div class="ad-content">
                    <script>atOptions = ${JSON.stringify(opts)};<\/script>
                    <script src="${scriptSrc}"><\/script>
                </div>
            </body>
            </html>
        `);
        d.close();
    }

    function mountNativeAd(container, scriptSrc, innerDivId) {
        if (!container || container.dataset.mounted === '1') return;
        container.dataset.mounted = '1';
        
        const iframe = document.createElement('iframe');
        iframe.setAttribute('scrolling', 'no');
        iframe.setAttribute('frameborder', '0');
        iframe.style.cssText = 'display:block; border:0; width:100%; height:100%; position:absolute; top:0; left:0;';
        iframe.title = 'Publicidade';
        container.appendChild(iframe);

        const d = iframe.contentWindow.document;
        d.open();
        d.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="utf-8">
                <style>
                    html, body { margin: 0; padding: 0; background: #000000; width:100%; height:100%; }
                    .ad-content { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; }
                </style>
            </head>
            <body>
                <div class="ad-content">
                    <div id="${innerDivId}"></div>
                    <script async data-cfasync="false" src="${scriptSrc}"><\/script>
                </div>
            </body>
            </html>
        `);
        d.close();
    }

    /* ========= FAVORITOS ========= */
    async function toggleFavorite(videoId) {
        if (!currentUser) {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('profile');
                provider.addScope('email');
                provider.setCustomParameters({ prompt: 'select_account' });
                await auth.signInWithPopup(provider);
                await rtdb.ref('vod_favorites/' + auth.currentUser.uid + '/' + videoId).set(true);
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                    alert('Erro ao entrar/favoritar: ' + err.message);
                }
            }
            return;
        }
        const ref = rtdb.ref('vod_favorites/' + currentUser.uid + '/' + videoId);
        try {
            if (userFavorites[videoId]) await ref.remove();
            else await ref.set(true);
        } catch (err) {
            alert('Erro ao favoritar: ' + err.message);
        }
    }

    /* ========= AUTH ========= */
    const loginBtn = document.getElementById('loginBtn');
    const userInfo = document.getElementById('userInfo');
    const userAvatar = document.getElementById('userAvatar');
    const userCard = document.getElementById('userCard');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');
    const logoutBtn = document.getElementById('logoutBtn');

    loginBtn.addEventListener('click', async () => {
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('profile');
            provider.addScope('email');
            provider.setCustomParameters({ prompt: 'select_account' });
            await auth.signInWithPopup(provider);
        } catch (error) {
            alert('Erro ao fazer login: ' + error.message);
        }
    });

    logoutBtn.addEventListener('click', () => {
        auth.signOut();
        userCard.classList.remove('active');
    });

    userAvatar.addEventListener('click', (e) => {
        e.stopPropagation();
        userCard.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
        if (!userCard.contains(e.target) && e.target !== userAvatar) {
            userCard.classList.remove('active');
        }
    });

    auth.onAuthStateChanged((user) => {
        currentUser = user;

        if (favoritesRef) { favoritesRef.off(); favoritesRef = null; }
        userFavorites = {};
        favoritesLoaded = false;

        if (user) {
            loginBtn.style.display = 'none';
            userInfo.classList.add('active');
            userAvatar.src = user.photoURL || 'https://www.gravatar.com/avatar/?d=mp';
            userName.textContent = user.displayName || 'Usuário';
            userEmail.textContent = user.email || '';
            document.body.classList.toggle('is-admin', user.email === ADMIN_EMAIL);

            favoritesRef = rtdb.ref('vod_favorites/' + user.uid);
            favoritesRef.on('value', (snap) => {
                userFavorites = snap.val() || {};
                favoritesLoaded = true;
                tryRender();
            });
        } else {
            loginBtn.style.display = 'flex';
            userInfo.classList.remove('active');
            userCard.classList.remove('active');
            document.body.classList.remove('is-admin');
            favoritesLoaded = true;
            tryRender();
        }

        if (currentPlayerVideoId) atualizarPlayerUI(currentPlayerVideoId);
    });

    /* ========= VOTOS ========= */
    function getVotesRef(videoId) { return rtdb.ref('vod_votes/' + videoId); }

    function calcularNotaFromCache(videoId) {
        const data = votesCache[videoId];
        if (!data) return 'N/D';
        const likes = data.likes || 0;
        const dislikes = data.dislikes || 0;
        const total = likes + dislikes;
        if (total === 0) return 'N/D';
        return ((likes / total) * 10).toFixed(1);
    }

    function atualizarTodosBadges() {
        document.querySelectorAll('.card[data-ytid]').forEach(card => {
            const videoId = card.dataset.ytid;
            const badge = card.querySelector('.rating-badge');
            if (badge) badge.textContent = `⭐ ${calcularNotaFromCache(videoId)}`;
        });
    }

    function atualizarPlayerUI(videoId) {
        const data = votesCache[videoId] || {};
        document.getElementById('playerLikeCount').textContent = data.likes || 0;
        document.getElementById('playerDislikeCount').textContent = data.dislikes || 0;
        const userVote = currentUser ? (data.userVotes || {})[currentUser.uid] : null;
        document.getElementById('playerLikeBtn').classList.toggle('active', userVote === 'like');
        document.getElementById('playerDislikeBtn').classList.toggle('active', userVote === 'dislike');
    }

    rtdb.ref('vod_votes').on('value', (snap) => {
        votesCache = snap.val() || {};
        atualizarTodosBadges();
        if (currentPlayerVideoId) atualizarPlayerUI(currentPlayerVideoId);
    });

    async function votar(videoId, tipo) {
        if (!currentUser) { alert('Faça login para votar.'); return; }
        const ref = getVotesRef(videoId);
        const userVoteRef = ref.child('userVotes/' + currentUser.uid);
        try {
            const snap = await userVoteRef.once('value');
            const votoAtual = snap.val();
            if (votoAtual === tipo) {
                await userVoteRef.remove();
                await ref.child(tipo === 'like' ? 'likes' : 'dislikes')
                    .transaction(c => Math.max(0, (c || 0) - 1));
            } else {
                if (votoAtual) {
                    await ref.child(votoAtual === 'like' ? 'likes' : 'dislikes')
                        .transaction(c => Math.max(0, (c || 0) - 1));
                }
                await userVoteRef.set(tipo);
                await ref.child(tipo === 'like' ? 'likes' : 'dislikes')
                    .transaction(c => (c || 0) + 1);
            }
        } catch (e) {
            console.error('Erro ao votar:', e);
        }
    }

    document.getElementById('playerLikeBtn').addEventListener('click', () => {
        if (currentPlayerVideoId) votar(currentPlayerVideoId, 'like');
    });
    document.getElementById('playerDislikeBtn').addEventListener('click', () => {
        if (currentPlayerVideoId) votar(currentPlayerVideoId, 'dislike');
    });

    /* ========= CATÁLOGO ========= */
    const catalogGrid = document.getElementById('catalogGrid');
    const loadingMsg = document.getElementById('loadingMsg');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');

    searchInput.addEventListener('input', (e) => {
        currentFilter = e.target.value.toLowerCase().trim();
        renderCards();
    });

    function tryRender() {
        if (videosLoaded && favoritesLoaded) renderCards();
    }

    function buildCard(item) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.ytid = item.youtubeId;
        card.dataset.key = item.key;

        const ytid = escapeHtml(item.youtubeId);
        const titulo = escapeHtml(item.titulo || '');
        const posterUrl = `https://img.youtube.com/vi/${ytid}/mqdefault.jpg`;
        const isFav = !!userFavorites[item.youtubeId];
        const nota = calcularNotaFromCache(item.youtubeId);

        const tags = [];
        if (item.lang === 'BRA') tags.push('<span class="tag tag-bra">BRA</span>');
        if (item.lang === 'ENG') tags.push('<span class="tag tag-eng">ENG</span>');
        if (item.pago) tags.push('<span class="tag tag-pago">PAGO</span>');
        if (item.ad) tags.push('<span class="tag tag-ad">AD</span>');
        const tagsHtml = tags.length
            ? `<div class="card-tags">${tags.join('')}</div>`
            : '<div class="card-tags"></div>';

        const produtora = (item.produtora || '').trim();
        const ano = (item.ano != null && item.ano !== '') ? item.ano : null;
        const produtoraHtml = produtora ? `<span class="card-meta-line">${escapeHtml(produtora)}</span>` : '';
        const anoHtml = ano !== null ? `<span class="card-meta-line">Ano: ${escapeHtml(String(ano))}</span>` : '';
        const metaHtml = (produtoraHtml || anoHtml)
            ? `<div class="card-meta">${produtoraHtml}${anoHtml}</div>`
            : '';

        card.innerHTML = `
            <div class="card-poster">
                <img src="${posterUrl}" alt="Capa de ${titulo}" loading="lazy">
                <div class="rating-badge">⭐ ${nota}</div>
                <button class="favorite-btn ${isFav ? 'active' : ''}" title="Favoritar">${isFav ? '❤️' : '🤍'}</button>
                <div class="admin-actions">
                    <button class="admin-btn edit" title="Editar vídeo">✏️</button>
                    <button class="admin-btn delete" title="Remover vídeo">🗑️</button>
                </div>
            </div>
            <div class="card-info">
                <h3 class="card-title">${titulo}</h3>
                ${metaHtml}
                ${tagsHtml}
                <button class="watch-btn">▶ Assistir</button>
            </div>
        `;

        card.querySelector('.favorite-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFavorite(item.youtubeId);
        });

        card.querySelector('.edit').addEventListener('click', (e) => {
            e.stopPropagation();
            openVideoModal('edit', item);
        });

        card.querySelector('.delete').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteVideo(item);
        });

        card.querySelector('.watch-btn').addEventListener('click', () => {
            if (item.ad) showAdInterstitial(item);
            else openPlayer(item);
        });

        return card;
    }

    function renderCards() {
        if (loadingMsg.style.display !== 'none') loadingMsg.style.display = 'none';

        const filtered = currentFilter
            ? videos.filter(v => (v.titulo || '').toLowerCase().includes(currentFilter))
            : videos;

        catalogGrid.innerHTML = '';
        const favSection = document.getElementById('favoritesSection');
        const favTrack = document.getElementById('favoritesTrack');
        if (favTrack) favTrack.innerHTML = '';
        let favCount = 0;

        if (videos.length === 0) {
            emptyState.textContent = 'Nenhum vídeo cadastrado ainda.';
            emptyState.style.display = 'block';
            if (favSection) favSection.style.display = 'none';
            return;
        }

        if (filtered.length === 0) {
            emptyState.textContent = `Nenhum resultado para "${currentFilter}".`;
            emptyState.style.display = 'block';
            if (favSection) favSection.style.display = 'none';
            return;
        }

        emptyState.style.display = 'none';

        filtered.forEach(item => {
            catalogGrid.appendChild(buildCard(item));
            if (userFavorites[item.youtubeId] && favTrack) {
                favTrack.appendChild(buildCard(item));
                favCount++;
            }
        });

        if (favSection) favSection.style.display = favCount > 0 ? 'block' : 'none';
    }

    rtdb.ref('vod_videos').on('value', (snap) => {
        const data = snap.val() || {};
        videos = Object.entries(data).map(([key, v]) => ({ key, ...v }));
        videos.sort((a, b) => (b.order || 0) - (a.order || 0));
        videosLoaded = true;
        tryRender();
    }, (err) => {
        loadingMsg.style.display = 'none';
        catalogGrid.innerHTML = `<div class="empty-state" style="display:block;">Erro ao carregar catálogo: ${escapeHtml(err.message)}</div>`;
    });

    /* ========= MODAL DE VÍDEO ========= */
    const videoModal = document.getElementById('videoModal');
    const videoModalTitle = document.getElementById('videoModalTitle');
    const videoModalSub = document.getElementById('videoModalSub');
    const videoUrlInput = document.getElementById('videoUrlInput');
    const videoTitleInput = document.getElementById('videoTitleInput');
    const videoLangInput = document.getElementById('videoLangInput');
    const videoProdutoraInput = document.getElementById('videoProdutoraInput');
    const videoAnoInput = document.getElementById('videoAnoInput');
    const urlHint = document.getElementById('urlHint');

    videoUrlInput.addEventListener('input', () => {
        const id = extractYouTubeId(videoUrlInput.value);
        if (!videoUrlInput.value.trim()) {
            urlHint.textContent = '';
            urlHint.className = 'url-hint';
        } else if (id) {
            urlHint.textContent = `ID detectado: ${id}`;
            urlHint.className = 'url-hint ok';
        } else {
            urlHint.textContent = 'URL inválida ou ID não reconhecido.';
            urlHint.className = 'url-hint warn';
        }
    });

    function openVideoModal(mode, video = null) {
        videoModalMode = mode;
        editingVideoKey = video ? video.key : null;

        if (mode === 'add') {
            videoModalTitle.textContent = 'Adicionar Vídeo';
            videoModalSub.textContent = 'O vídeo ficará visível para todos os usuários.';
            videoUrlInput.value = '';
            videoTitleInput.value = '';
            videoProdutoraInput.value = '';
            videoAnoInput.value = '';
            videoLangInput.value = '';
            const noneMarker = document.querySelector('input[name="videoMarker"][value=""]');
            if (noneMarker) noneMarker.checked = true;
            urlHint.textContent = '';
            urlHint.className = 'url-hint';
        } else {
            videoModalTitle.textContent = 'Editar Vídeo';
            videoModalSub.textContent = 'Altere as informações do vídeo.';
            videoUrlInput.value = `https://www.youtube.com/watch?v=${video.youtubeId}`;
            videoTitleInput.value = video.titulo || '';
            videoProdutoraInput.value = video.produtora || '';
            videoAnoInput.value = video.ano != null ? String(video.ano) : '';
            videoLangInput.value = video.lang || '';
            const currentMarker = video.pago ? 'pago' : (video.ad ? 'ad' : '');
            const markerEl = document.querySelector(`input[name="videoMarker"][value="${currentMarker}"]`);
            if (markerEl) markerEl.checked = true;
            urlHint.textContent = `ID atual: ${video.youtubeId}`;
            urlHint.className = 'url-hint ok';
        }

        videoModal.classList.add('active');
        setTimeout(() => videoUrlInput.focus(), 50);
    }

    function closeVideoModal() {
        videoModal.classList.remove('active');
        videoModalMode = 'add';
        editingVideoKey = null;
    }

    document.getElementById('cancelVideoBtn').addEventListener('click', closeVideoModal);
    videoModal.addEventListener('click', (e) => {
        if (e.target === videoModal) closeVideoModal();
    });

    document.getElementById('confirmVideoBtn').addEventListener('click', async () => {
        const urlRaw = videoUrlInput.value.trim();
        const titulo = videoTitleInput.value.trim();
        const produtora = videoProdutoraInput.value.trim();
        const anoRaw = videoAnoInput.value.trim();
        const lang = videoLangInput.value;
        const markerEl = document.querySelector('input[name="videoMarker"]:checked');
        const marker = markerEl ? markerEl.value : '';
        const pago = marker === 'pago';
        const ad = marker === 'ad';

        if (!urlRaw) { alert('Informe a URL do YouTube.'); return; }
        if (!titulo) { alert('Informe o título.'); return; }

        let ano = null;
        if (anoRaw) {
            if (!/^\d{4}$/.test(anoRaw)) { alert('Ano inválido. Use 4 dígitos (ex.: 1950).'); return; }
            ano = parseInt(anoRaw, 10);
        }

        const youtubeId = extractYouTubeId(urlRaw);
        if (!youtubeId) { alert('URL do YouTube inválida.'); return; }

        const duplicate = videos.find(v => v.youtubeId === youtubeId && v.key !== editingVideoKey);
        if (duplicate) {
            alert(`Este vídeo já está cadastrado com o título: "${duplicate.titulo}"`);
            return;
        }

        try {
            const payload = {
                youtubeId, titulo,
                produtora: produtora || null,
                ano: ano,
                lang: lang || null,
                pago: !!pago,
                ad: !!ad
            };
            if (videoModalMode === 'add') {
                payload.order = Date.now();
                await rtdb.ref('vod_videos').push().set(payload);
            } else {
                await rtdb.ref('vod_videos/' + editingVideoKey).update(payload);
            }
            closeVideoModal();
        } catch (err) {
            alert('Erro ao salvar: ' + err.message);
        }
    });

    async function deleteVideo(video) {
        if (!isAdmin()) return;
        if (!confirm(`Remover o vídeo "${video.titulo}"?`)) return;
        try { await rtdb.ref('vod_videos/' + video.key).remove(); }
        catch (err) { alert('Erro ao remover: ' + err.message); }
    }

    document.getElementById('addVideoBtn').addEventListener('click', () => openVideoModal('add'));

    /* ========= PLAYER ========= */
    const playerScreen = document.getElementById('playerScreen');
    const playerWrapper = document.getElementById('playerWrapper');
    const customUI = document.getElementById('customUI');
    const centerPlayPauseBtn = document.getElementById('centerPlayPauseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const btnRewind10 = document.getElementById('btnRewind10');
    const btnForward10 = document.getElementById('btnForward10');
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.getElementById('progressTrack');
    const timeLabel = document.getElementById('timeLabel');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const playerBottomAd = document.getElementById('player-bottom-ad');
    const horizontalAdIframe = document.getElementById('horizontal-ad-iframe');

    let player = null;
    let playerReady = false;
    let progressInterval = null;
    let controlsTimeout = null;
    let isPlaying = false;
    let isEnded = false;
    let isMuted = false;
    let currentVolume = 100;

    window.onYouTubeIframeAPIReady = function() {};

    /* ========= INTERSTICIAL ========= */
    let pendingVideo = null;
    let adTimerInterval = null;

    const adModal = document.getElementById('adInterstitialModal');
    const closeAdBtn = document.getElementById('closeInterstitialBtn');
    const adTimerText = document.getElementById('adTimerText');

    function showAdInterstitial(video) {
        pendingVideo = video;
        adModal.classList.add('active');

        if (!adModal.dataset.adsMounted) {
            adModal.dataset.adsMounted = '1';
            mountNativeAd(
                document.getElementById('adNativeLeft'),
                'https://dcengg.org/21/efe34bd92ca74a51f85465ca14314dc7',
                'container-efe34bd92ca74a51f85465ca14314dc7'
            );
            mountStandardAd(
                document.getElementById('adNativeRight'),
                { key: '0b2a1dd49cefbcb5c3f10330c969042c', format: 'iframe', height: 600, width: 160, params: {} },
                'https://dcengg.org/22/0b2a1dd49cefbcb5c3f10330c969042c'
            );
        }

        if (!document.getElementById('social-bar-iframe')) {
            const iframe = document.createElement('iframe');
            iframe.id = 'social-bar-iframe';
            iframe.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 99998; pointer-events: none;';
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');
            iframe.srcdoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { margin: 0; padding: 0; overflow: hidden; background: transparent; pointer-events: none; }
                        div, iframe { pointer-events: auto; }
                    </style>
                </head>
                <body>
                    <script data-cfasync="false" src="https://dcengg.org/14/43f4c5741bc3c8356edda781f5cc7d4d?t=` + Date.now() + `"><\/script>
                </body>
                </html>
            `;
            document.body.appendChild(iframe);
        }

        let timeLeft = 5;
        closeAdBtn.disabled = true;
        closeAdBtn.classList.remove('active');
        closeAdBtn.textContent = 'Fechar e Assistir';
        adTimerText.textContent = `Aguarde ${timeLeft}s...`;

        clearInterval(adTimerInterval);
        adTimerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                adTimerText.textContent = `Aguarde ${timeLeft}s...`;
            } else {
                clearInterval(adTimerInterval);
                adTimerText.textContent = 'Pronto!';
                closeAdBtn.disabled = false;
                closeAdBtn.classList.add('active');
                closeAdBtn.textContent = 'Fechar e Assistir ▶';
            }
        }, 1000);
    }

    closeAdBtn.addEventListener('click', () => {
        if (closeAdBtn.disabled) return;
        adModal.classList.remove('active');
        const sbIframe = document.getElementById('social-bar-iframe');
        if (sbIframe) sbIframe.remove();
        if (pendingVideo) {
            const videoToPlay = pendingVideo;
            pendingVideo = null;
            openPlayer(videoToPlay);
        }
    });

    /* ========= OPEN PLAYER ========= */
    async function openPlayer(video) {
        if (!currentUser) {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('profile');
                provider.addScope('email');
                provider.setCustomParameters({ prompt: 'select_account' });
                await auth.signInWithPopup(provider);
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                    alert('Erro ao entrar: ' + err.message);
                }
                return;
            }
        }
        playerScreen.classList.add('active');
        document.body.style.overflow = 'hidden';

        if (!window.matchMedia('(max-width: 900px)').matches) {
            playerBottomAd.style.display = 'block';
            if (!playerBottomAd.dataset.mounted) {
                playerBottomAd.dataset.mounted = '1';
                
                horizontalAdIframe.srcdoc = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="utf-8">
                        <style>
                            html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
                        </style>
                    </head>
                    <body>
                        <script type="text/javascript">
                            atOptions = {
                                'key' : 'c0b67a9be1ab830aba44c6c24a020adc',
                                'format' : 'iframe',
                                'height' : 90,
                                'width' : 728,
                                'params' : {}
                            };
                        <\/script>
                        <script type="text/javascript" src="https://dcengg.org/22/c0b67a9be1ab830aba44c6c24a020adc"><\/script>
                    </body>
                    </html>
                `;
            }
        }

        if (player) { player.destroy(); player = null; }
        playerReady = false;
        isPlaying = false;
        isEnded = false;

        centerPlayPauseBtn.innerHTML = '▶';
        centerPlayPauseBtn.classList.remove('playing-state');

        currentPlayerVideoId = video.youtubeId;
        atualizarPlayerUI(video.youtubeId);

        showControls();

        const container = document.getElementById('youtubePlayer');
        container.innerHTML = '<div id="ytPlayerDiv" style="width:100%; height:100%;"></div>';

        player = new YT.Player('ytPlayerDiv', {
            height: '100%', width: '100%', videoId: video.youtubeId,
            playerVars: {
                'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0,
                'iv_load_policy': 3, 'playsinline': 1, 'cc_load_policy': 0, 'fs': 0
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        playerReady = true;
        event.target.playVideo();
        startProgressTracker();
        event.target.setVolume(currentVolume);
        updateVolumeUI(currentVolume);
        removeCaptions(event.target);
    }

    function onPlayerStateChange(event) {
        if (event.data === 1) {
            isPlaying = true; isEnded = false;
            centerPlayPauseBtn.innerHTML = '⏸';
            centerPlayPauseBtn.classList.add('playing-state');
            removeCaptions(event.target);
            resetControlsTimer();
        } else if (event.data === 2) {
            isPlaying = false; isEnded = false;
            centerPlayPauseBtn.innerHTML = '▶';
            centerPlayPauseBtn.classList.remove('playing-state');
            showControls();
            clearTimeout(controlsTimeout);
        } else if (event.data === 0) {
            isPlaying = false; isEnded = true;
            centerPlayPauseBtn.innerHTML = '▶';
            centerPlayPauseBtn.classList.remove('playing-state');
            showControls();
            clearTimeout(controlsTimeout);
        } else if (event.data === 3) {
            removeCaptions(event.target);
        }
    }

    function removeCaptions(target) {
        try {
            target.unloadModule('captions');
            target.unloadModule('cc');
            target.setOption('captions', 'track', {});
            target.setOption('cc', 'track', {});
        } catch (e) {}
    }

    function showControls() {
        customUI.classList.remove('player-ui-hidden');
        playerWrapper.classList.remove('hide-shadows');
        resetControlsTimer();
    }

    function hideControls() {
        if (isEnded) return;
        customUI.classList.add('player-ui-hidden');
        playerWrapper.classList.add('hide-shadows');
    }

    function resetControlsTimer() {
        clearTimeout(controlsTimeout);
        if (isEnded) return;
        controlsTimeout = setTimeout(hideControls, 5500);
    }

    playerWrapper.addEventListener('mousemove', showControls);
    playerWrapper.addEventListener('mouseleave', () => resetControlsTimer());

    playerWrapper.addEventListener('click', (e) => {
        if (e.target.closest('.custom-ui')) return;
        if (!playerReady || !player) return;
        if (isPlaying) player.pauseVideo();
        else player.playVideo();
        resetControlsTimer();
    });

    document.addEventListener('fullscreenchange', () => {
        if (playerScreen.classList.contains('active')) showControls();
    });

    centerPlayPauseBtn.addEventListener('click', () => {
        if (!playerReady || !player) return;
        if (isPlaying) player.pauseVideo();
        else player.playVideo();
        resetControlsTimer();
    });

    function updateVolumeUI(val) {
        volumeSlider.value = val;
        if (val == 0) { muteBtn.textContent = '🔇'; isMuted = true; }
        else if (val < 50) { muteBtn.textContent = '🔈'; isMuted = false; }
        else { muteBtn.textContent = '🔊'; isMuted = false; }
    }

    muteBtn.addEventListener('click', () => {
        if (!playerReady || !player) return;
        if (isMuted) { player.unMute(); player.setVolume(currentVolume); updateVolumeUI(currentVolume); }
        else { player.mute(); updateVolumeUI(0); }
        resetControlsTimer();
    });

    volumeSlider.addEventListener('input', (e) => {
        if (!playerReady || !player) return;
        const val = parseInt(e.target.value);
        if (val > 0) currentVolume = val;
        if (val == 0) player.mute();
        else { player.unMute(); player.setVolume(val); }
        updateVolumeUI(val);
        resetControlsTimer();
    });

    function closePlayer() {
        if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
        if (player) { player.destroy(); player = null; }
        playerReady = false;
        isEnded = false;
        currentPlayerVideoId = null;
        playerScreen.classList.remove('active');
        document.body.style.overflow = '';
        progressFill.style.width = '0%';
        timeLabel.textContent = '0:00 / 0:00';
        clearTimeout(controlsTimeout);
        playerBottomAd.style.display = 'none';
    }

    document.getElementById('closePlayerBtn').addEventListener('click', closePlayer);

    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (playerWrapper.requestFullscreen) playerWrapper.requestFullscreen();
            else if (playerWrapper.webkitRequestFullscreen) playerWrapper.webkitRequestFullscreen();
            else if (playerWrapper.msRequestFullscreen) playerWrapper.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && playerScreen.classList.contains('active')) closePlayer();
    });

    function startProgressTracker() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (!playerReady || !player || typeof player.getCurrentTime !== 'function') return;
            try {
                const currentTime = player.getCurrentTime() || 0;
                const duration = player.getDuration() || 0;
                if (duration > 0) {
                    progressFill.style.width = `${(currentTime / duration) * 100}%`;
                    timeLabel.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
                }
            } catch (e) {}
        }, 500);
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        return `${m}:${String(s).padStart(2, '0')}`;
    }

    btnForward10.addEventListener('click', () => {
        if (!playerReady || !player || typeof player.seekTo !== 'function') return;
        player.seekTo(Math.min(player.getDuration(), player.getCurrentTime() + 10), true);
        resetControlsTimer();
    });

    btnRewind10.addEventListener('click', () => {
        if (!playerReady || !player || typeof player.seekTo !== 'function') return;
        player.seekTo(Math.max(0, player.getCurrentTime() - 10), true);
        resetControlsTimer();
    });

    progressTrack.addEventListener('click', (e) => {
        if (!playerReady || !player || typeof player.seekTo !== 'function') return;
        const rect = progressTrack.getBoundingClientRect();
        const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        player.seekTo(percent * player.getDuration(), true);
        resetControlsTimer();
    });

    /* ========= CARROSSEL ========= */
    const track = document.getElementById('favoritesTrack');
    const leftBtn = document.getElementById('carouselLeft');
    const rightBtn = document.getElementById('carouselRight');
    if (track && leftBtn && rightBtn) {
        leftBtn.addEventListener('click', () => track.scrollBy({ left: -300, behavior: 'smooth' }));
        rightBtn.addEventListener('click', () => track.scrollBy({ left: 300, behavior: 'smooth' }));
    }
</script>
</body>
</html>
